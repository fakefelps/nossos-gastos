<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F2">
  <title>Nossos gastos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa" autocomplete="on">
      <h1 class="marca">Nossos gastos</h1>
      <p class="login-sub">Felipe e Mariana</p>
      <label>E-mail
        <input type="email" name="email" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" name="senha" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-cheio">Entrar</button>
      <p id="login-erro" class="erro" role="alert"></p>
    </form>
  </main>

  <!-- ============ APP ============ -->
  <div id="tela-app" hidden>
    <header class="topo">
      <div class="topo-linha">
        <span class="marca marca-p">Nossos gastos</span>
        <div class="usuario">
          <span id="usuario-nome" class="chip-pessoa"></span>
          <button id="btn-sair" class="btn-texto" type="button">Sair</button>
        </div>
      </div>
      <div class="seletor-mes" aria-label="Mês">
        <button type="button" class="btn-mes" data-acao="mes-ant" aria-label="Mês anterior">‹</button>
        <button type="button" id="mes-nome" class="mes-nome" data-acao="mes-hoje" title="Voltar para o mês atual"></button>
        <button type="button" class="btn-mes" data-acao="mes-prox" aria-label="Próximo mês">›</button>
      </div>
      <nav class="abas" aria-label="Seções">
        <button type="button" data-aba="acerto"><span class="ico">⇄</span>Acerto</button>
        <button type="button" data-aba="moradia"><span class="ico">⌂</span>Moradia</button>
        <button type="button" data-aba="lancar" class="aba-lancar"><span class="ico">＋</span>Lançar</button>
        <button type="button" data-aba="historico"><span class="ico">▁▃▅</span>Histórico</button>
        <button type="button" data-aba="eu"><span class="ico">◐</span>Minha área</button>
      </nav>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="carregando" class="carregando">Carregando…</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
